name: Build Ludo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Check required project files
        run: |
          set -eu
          test -f package.json || { echo "ERROR: package.json missing"; exit 1; }
          test -f capacitor.config.json || { echo "ERROR: capacitor.config.json missing"; exit 1; }
          test -f www/index.html || { echo "ERROR: www/index.html missing"; exit 1; }
          test -f www/app.js || { echo "ERROR: www/app.js missing"; exit 1; }
          test -f www/style.css || { echo "ERROR: www/style.css missing"; exit 1; }
          test -f www/icon.svg || { echo "ERROR: www/icon.svg missing"; exit 1; }

      - name: Check JavaScript syntax
        run: node --check www/app.js

      - name: Install dependencies
        run: npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Apply Nice Ludo launcher icon
        run: |
          set -eu
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi android/app/src/main/res/mipmap-anydpi-v26
          cp android-res/drawable/ic_launcher_foreground.xml android/app/src/main/res/drawable/
          cp android-res/values/ic_launcher_background.xml android/app/src/main/res/values/
          cp android-res/mipmap-anydpi/ic_launcher.xml android/app/src/main/res/mipmap-anydpi/
          cp android-res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/
          cp android-res/mipmap-anydpi-v26/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --stop
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nice-Ludo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
