```yaml
name: Build Ludo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          which java

      - name: Check project files
        run: |
          pwd
          ls -la
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f www/app.js
          test -f www/style.css
          node --check www/app.js

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: |
          npx cap sync android

          echo "=== ANDROID INDEX.HTML CHECK ==="
          grep -n -E 'soundToggle|cd786hassan' \
            android/app/src/main/assets/public/index.html

          echo "=== ANDROID APP.JS CHECK ==="
          grep -n -E 'soundToggle|showConfirm' \
            android/app/src/main/assets/public/app.js

          echo "=== ANDROID CSS CHECK ==="
          grep -n -E 'sound-toggle|developer-credit|modal-actions' \
            android/app/src/main/assets/public/style.css

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
