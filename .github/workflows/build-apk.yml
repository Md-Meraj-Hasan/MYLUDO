name: Build Ludo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Check required project files
        run: |
          set -eu
          test -f package.json || { echo "ERROR: package.json missing"; exit 1; }
          test -f capacitor.config.json || { echo "ERROR: capacitor.config.json missing"; exit 1; }
          test -f www/index.html || { echo "ERROR: www/index.html missing"; exit 1; }
          test -f www/app.js || { echo "ERROR: www/app.js missing"; exit 1; }
          test -f www/style.css || { echo "ERROR: www/style.css missing"; exit 1; }
          test -f www/icon.svg || { echo "ERROR: www/icon.svg missing"; exit 1; }

      - name: Check JavaScript syntax
        run: node --check www/app.js

      - name: Install dependencies
        run: npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Apply Nice Ludo launcher icon
        run: |
          set -eu
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values android/app/src/main/res/mipmap-anydpi android/app/src/main/res/mipmap-anydpi-v26
          python -m pip install --quiet pillow
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          python - <<'PY'
          from PIL import Image
          im=Image.open('www/nice-ludo-logo.png').convert('RGBA')
          im.thumbnail((512,512),Image.Resampling.LANCZOS)
          canvas=Image.new('RGBA',(512,512),(0,0,0,255))
          canvas.alpha_composite(im,((512-im.width)//2,(512-im.height)//2))
          im=canvas
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density,size in sizes.items():
              out=im.resize((size,size),Image.Resampling.LANCZOS)
              out.save(f'android/app/src/main/res/mipmap-{density}/ic_launcher.png')
              out.save(f'android/app/src/main/res/mipmap-{density}/ic_launcher_round.png')
          PY
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          match=re.search(r'<application\b[^>]*>',s)
          if not match:
              raise SystemExit('Could not find application opening tag in AndroidManifest.xml')
          tag=match.group(0)
          tag=re.sub(r'\s+android:icon="[^"]*"','',tag)
          tag=re.sub(r'\s+android:roundIcon="[^"]*"','',tag)
          tag=tag[:-1] + ' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">'
          s=s[:match.start()]+tag+s[match.end():]
          open(p,'w',encoding='utf-8').write(s)
          # Keep the full original artwork for the native Android startup splash.
          from PIL import Image
          logo=Image.open('www/nice-ludo-logo.png').convert('RGBA')
          logo.thumbnail((512,512),Image.Resampling.LANCZOS)
          splash=Image.new('RGBA',(512,512),(11,16,40,255))
          splash.alpha_composite(logo,((512-logo.width)//2,(512-logo.height)//2))
          splash.save('android/app/src/main/res/drawable/splash.png')
          # Configure both legacy and Android 12+ native launch splash.
          sp='android/app/src/main/res/values/styles.xml'
          styles=open(sp,encoding='utf-8').read()
          launch=re.search(r'<style\s+name=["\']AppTheme\.NoActionBarLaunch["\']([^>]*)>(.*?)</style>',styles,re.S)
          if not launch:
              raise SystemExit('AppTheme.NoActionBarLaunch style not found')
          attrs=launch.group(1)
          if re.search(r'parent=["\'][^"\']+["\']',attrs):
              attrs=re.sub(r'parent=["\'][^"\']+["\']','parent="Theme.SplashScreen"',attrs)
          else:
              attrs+=' parent="Theme.SplashScreen"'
          body=launch.group(2)
          body=re.sub(r'\s*<item\s+name=["\'](?:android:)?windowSplashScreenBackground["\'][^>]*>.*?</item>','',body,flags=re.S)
          body=re.sub(r'\s*<item\s+name=["\'](?:android:)?windowSplashScreenAnimatedIcon["\'][^>]*>.*?</item>','',body,flags=re.S)
          body=re.sub(r'\s*<item\s+name=["\']postSplashScreenTheme["\'][^>]*>.*?</item>','',body,flags=re.S)
          body=re.sub(r'\s*<item\s+name=["\']android:windowBackground["\'][^>]*>.*?</item>','',body,flags=re.S)
          body+='\n        <item name="windowSplashScreenBackground">#0B1028</item>\n        <item name="windowSplashScreenAnimatedIcon">@drawable/splash</item>\n        <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>\n        <item name="android:windowBackground">@drawable/splash</item>\n        '
          replacement='<style name="AppTheme.NoActionBarLaunch"'+attrs+'>'+body+'</style>'
          styles=styles[:launch.start()]+replacement+styles[launch.end():]
          open(sp,'w',encoding='utf-8').write(styles)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --stop
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nice-Ludo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
