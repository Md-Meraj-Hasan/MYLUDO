```yaml
name: Build Ludo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Debug project files
        run: |
          pwd
          ls -la
          ls -la www || true
          test -f package.json && echo "package.json OK" || echo "package.json MISSING"
          test -f capacitor.config.json && echo "capacitor.config.json OK" || echo "capacitor.config.json MISSING"
          test -f www/index.html && echo "index.html OK" || echo "index.html MISSING"
          test -f www/app.js && echo "app.js OK" || echo "app.js MISSING"
          test -f www/style.css && echo "style.css OK" || echo "style.css MISSING"

      - name: Verify required web assets
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f www/app.js
          test -f www/style.css
          node --check www/app.js

      - name: Install dependencies
        run: npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
```
