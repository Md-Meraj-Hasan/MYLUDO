
name: Build Ludo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show project files
        run: |
          echo "Project root:"
          pwd
          echo "Root files:"
          ls -la
          echo "Web files:"
          ls -la www || true
          echo "Capacitor configuration:"
          find . -maxdepth 2 -type f \
            \( -name 'capacitor.config.*' -o -name 'package.json' \) \
            -not -path './node_modules/*' -print

      - name: Verify required project files
        run: |
          set -eu

          test -f package.json || {
            echo "ERROR: package.json is missing from the repository root."
            exit 1
          }

          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then
            echo "ERROR: Capacitor configuration is missing."
            echo "Expected capacitor.config.json, .ts, or .js."
            exit 1
          fi

          test -f www/index.html || {
            echo "ERROR: www/index.html is missing."
            exit 1
          }

          test -f www/app.js || {
            echo "ERROR: www/app.js is missing."
            exit 1
          }

          test -f www/style.css || {
            echo "ERROR: www/style.css is missing."
            exit 1
          }

          echo "All required project files were found."

      - name: Check JavaScript syntax
        run: node --check www/app.js

      - name: Install dependencies
        run: npm install

      - name: Check Capacitor
        run: npx cap --version

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
