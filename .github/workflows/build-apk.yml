
name: Build Ludo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Diagnose project files
        run: |
          echo "=== Repository root ==="
          pwd
          ls -la
          echo "=== Web assets ==="
          if [ -d www ]; then
            ls -la www
          else
            echo "MISSING DIRECTORY: www"
            exit 1
          fi
          echo "=== Checking required files ==="
          test -f package.json || { echo "MISSING: package.json"; exit 1; }
          test -f capacitor.config.json || { echo "MISSING: capacitor.config.json"; exit 1; }
          test -f www/index.html || { echo "MISSING: www/index.html"; exit 1; }
          test -f www/app.js || { echo "MISSING: www/app.js"; exit 1; }
          test -f www/style.css || { echo "MISSING: www/style.css"; exit 1; }
          echo "=== JavaScript syntax ==="
          node --check www/app.js
          echo "All required files passed checks."

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
