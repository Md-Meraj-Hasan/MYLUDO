name: Build Ludo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Check required project files
        run: |
          set -eu
          test -f package.json || { echo "ERROR: package.json missing"; exit 1; }
          test -f capacitor.config.json || { echo "ERROR: capacitor.config.json missing"; exit 1; }
          test -f www/index.html || { echo "ERROR: www/index.html missing"; exit 1; }
          test -f www/app.js || { echo "ERROR: www/app.js missing"; exit 1; }
          test -f www/style.css || { echo "ERROR: www/style.css missing"; exit 1; }
          test -f www/icon.svg || { echo "ERROR: www/icon.svg missing"; exit 1; }

      - name: Check JavaScript syntax
        run: node --check www/app.js

      - name: Install dependencies
        run: npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Apply Nice Ludo launcher icon
        run: |
          set -eu
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values android/app/src/main/res/mipmap-anydpi android/app/src/main/res/mipmap-anydpi-v26
          python -m pip install --quiet pillow
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          python - <<'PY'
          from PIL import Image
          im=Image.open('www/nice-ludo-logo.png').convert('RGBA')
          im.thumbnail((512,512),Image.Resampling.LANCZOS)
          canvas=Image.new('RGBA',(512,512),(0,0,0,255))
          canvas.alpha_composite(im,((512-im.width)//2,(512-im.height)//2))
          im=canvas
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density,size in sizes.items():
              out=im.resize((size,size),Image.Resampling.LANCZOS)
              out.save(f'android/app/src/main/res/mipmap-{density}/ic_launcher.png')
              out.save(f'android/app/src/main/res/mipmap-{density}/ic_launcher_round.png')
          PY
          rm -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          p='android/app/src/main/AndroidManifest.xml'
          tree=ET.parse(p); root=tree.getroot()
          ns='{http://schemas.android.com/apk/res/android}'
          app=root.find('application')
          app.set(ns+'icon','@mipmap/ic_launcher')
          app.set(ns+'roundIcon','@mipmap/ic_launcher_round')
          tree.write(p,encoding='utf-8',xml_declaration=True)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --stop
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nice-Ludo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
